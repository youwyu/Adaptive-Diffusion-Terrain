[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-terrain-diffusion"
version = "0.4.1"
description = "Fast difficulty-conditioned terrain generation with ONNX Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Youwei Yu" }]
keywords = ["terrain generation", "consistency models", "robotics", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "onnxruntime-gpu>=1.18; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.18; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
images = ["Pillow>=9.0"]
dev = ["build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/youwyu/Adaptive-Diffusion-Terrain"
Repository = "https://github.com/youwyu/Adaptive-Diffusion-Terrain"
Issues = "https://github.com/youwyu/Adaptive-Diffusion-Terrain/issues"

[project.scripts]
terrain-diffusion = "terrain_diffusion.cli:main"

[tool.setuptools.packages.find]
include = ["terrain_diffusion*"]

[tool.setuptools.package-data]
terrain_diffusion = ["weights/*.onnx", "licenses/*.txt"]
